<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One App</title>
  <link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/primevue@4.0.0-rc.2/umd/primevue.min.js"></script>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown.min.css">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 100px;
      max-width: 980px;
      margin: 0px 0px 0px;
      padding: 15px;
    }

    .app-dark .markdown-body {
      background-color: #18181B;
      color: white;
    }
  </style>
</head>

<body class="bg-gray-100">
  <div id="app">
    <!-- App Header -->
    <p class="text-xl font-bold text-center px-4 py-2">
      App
    </p>

    <!-- Tabbed Navigation -->
    <p-tabs :value="activeTab" scrollable>
      <p-tablist>
        <p-tab v-for="(c, i) in TABS" :key="c" :value="`${c}`">{{ c }}</p-tab>
      </p-tablist>

      <p-tabpanels>
        <!-- Dashboard Tab -->
        <p-tabpanel value="Dashboard">
          <div>
            <h2 class="text-xl font-bold mb-4">Dashboard</h2>

            <!-- Tasks Section -->
            <div class="mb-6">
              <div class="flex gap-2 items-center mb-4">
                <p-button label="Prev 100" @click="(e)=>{page-=1;fetchAndDisplayTasks(e,page);}"></p-button>
                <p-button label="Next 100" @click="(e)=>{page+=1;fetchAndDisplayTasks(e,page);}"></p-button>
              </div>

              <div v-if="tasks.length > 0" class="card text-xs">
                <p-datatable :value="tasks" paginator :rows="10">
                  <p-column field="task_id" sortable header="Task ID"></p-column>
                  <p-column field="status" sortable header="Status"></p-column>
                  <p-column field="date_done" sortable header="Date Done"></p-column>

                  <p-column>
                    <template #body="slotProps">
                      <div class="flex gap-1 items-center">
                        <p-button label="show" @click="()=>{checkTaskMeta(slotProps.data)}" /></p-button>
                        <p-button label="stop" class="p-button-danger" @click="() => stopTask(slotProps.data.task_id)"></p-button>
                      </div>
                    </template>
                  </p-column>

                </p-datatable>
              </div>

              <p v-else class="text-gray-500">No tasks available.</p>
            </div>

            <!-- Task Meta Controls -->
            <p-taskmeta :data="taskMeta"></p-taskmeta>

            <!-- Workers Section -->
            <div class="mb-4">
              <p-button label="Get Workers" class="mb-2" @click="fetchWorkers"></p-button>
              <!-- Worker Information -->
              <p-recursivejson class="bg-gray-100" :data="workersInfo" />
            </div>
          </div>
        </p-tabpanel>

        <!-- Dynamic Task Tabs -->
        <p-tabpanel v-for="(fn, i) in all_schema" :key="fn.name" :value="fn.name">
          <div>
            <h2 class="text-xl font-bold m-2">{{ fn.name }}</h2>
            <p class="mb-2 whitespace-pre-line">{{ fn.description }}</p>
            <h3 class="text-lg font-bold mt-4 mb-2">Parameters</h3>

            <form @submit.prevent="submitDynamicTask(fn, i)">
              <p-autoform :schema="fn.parameters" :data="dynamicTasks[i]" :autits="autocompleteItems"></p-autoform>
              <p-button label="Submit Task" type="submit" class="mt-2" :disabled="loading"></p-button>
            </form>

            <!-- Task Submission Result -->
            <div v-if="taskId" class="mt-4">
              <h3 class="text-lg font-bold">Task Submitted</h3>
              <p class="text-green-600">Task ID: {{ taskId }}</p>
              <div class="mb-4 flex gap-2">
                <p-button label="Check Task Meta" @click="() => checkTaskMeta(taskId)"></p-button>
                <p-button label="Stop Task" class="p-button-danger" @click="() => stopTask(taskId)"></p-button>
              </div>

              <!-- Task Meta Details -->
              <p-taskmeta :data="taskMeta"></p-taskmeta>

              <!-- Error Message -->
              <div v-if="errorMessage" class="mt-4">
                <h3 class="text-lg font-bold text-red-600">Error</h3>
                <p>{{ errorMessage }}</p>
              </div>
            </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

    
    <div>
      <p-dataview :value="all_schema">
        <template #list="slotProps">
          <div v-for="(item, index) in slotProps.items" :key="index">
            <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
              :class="{ 'border-t border-surface-200 dark:border-surface-700': index !== 0 }">              
            {{item.name}}
            </div>
          </div>
        </template>
      </p-dataview>
    </div>
    
  </div>

  <p-toast />
</body>


<script>
  const { createApp, ref } = Vue;


  // Minimal APIClient, only with the needed methods (no auth)
  class APIClient {
    constructor(baseURL = '') {
      this.baseURL = baseURL;
    }
    async request(endpoint, method = "GET", body = null, isJSON = true) {
      const options = { method, headers: {} };
      if (isJSON) options.headers["Content-Type"] = "application/json";
      if (body) options.body = isJSON ? JSON.stringify(body) : body;
      const response = await fetch(`${this.baseURL}${endpoint}`, options);
      if (!response.ok) {
        const error = await response.json().catch(() => ({ message: "Unknown error" }));
        throw new Error(error.detail || error.message || "Request failed");
      }
      return response.json();
    }
    async getTaskMeta(task_id) { return await this.request(`/tasks/meta/${task_id}`); }
    async stopTask(task_id) { return await this.request(`/tasks/stop/${task_id}`, "GET"); }
    async fetchWorkers() { return await this.request('/workers/'); }
    async getTasks(page = 1, page_size = 10) {
      return await this.request(`/tasks?page=${page}&page_size=${page_size}&decode_func=js`);
    }
    async getActions() { return await this.request('/action/list?format=openai'); }
    async submitTask(func_name, inputs, taskMeta, taskId, errorMessage, loading) {
      console.log(inputs);
      loading.value = true;
      taskMeta.value = "";
      func_name = func_name.toLowerCase();
      try {
        const response = await fetch(`/${func_name}/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(inputs),
        });
        if (!response.ok) {
          const errorData = await response.json();
          taskId.value = null;
          errorMessage.value = errorData.detail;
          loading.value = false;
          return;
        }
        const data = await response.json();
        taskId.value = data.task_id;
        errorMessage.value = null;
      } catch (error) {
        taskId.value = null;
        errorMessage.value = error.message || JSON.stringify(error);
      }
      loading.value = false;
    }

  }

  const app = createApp({
    setup() {

      const toast = PrimeVue.useToast();
      const showInfo = (msg = 'Info Content', life = 1000) => {
        toast.add({ severity: 'info', summary: 'Info', detail: msg, life: life });
      };
      const showError = (msg = 'Error Content', life = 5000) => {
        console.error(msg);
        toast.add({ severity: 'error', summary: 'Error', detail: msg, life: life });
      };

      const taskId = ref(null);
      const errorMessage = ref(null);
      const loading = ref(false);


      // Tasks
      const api = new APIClient();
      const tasks = ref([]);
      const taskOptions = ref([]);
      const selectedTaskId = ref(null);
      const taskMeta = ref("");
      const workersInfo = ref("");
      const page = ref(1);
      const page_size = ref(100);
      const decode_func = ref("");

      const fetchAndDisplayTasks = async (e) => {
        const res = await api.getTasks(page.value, page_size.value);
        tasks.value = res.tasks
        const current_page = res.page;
        if (page.value != current_page) {
          showError(`No such page, set page to ${current_page}`)
          page.value = current_page;
        }
        taskOptions.value = tasks.value.map(v => v.task_id);
        decode_func.value = res.decode_func;
      };
      fetchAndDisplayTasks();

      const fetchWorkers = async () => {
        workersInfo.value = await api.fetchWorkers();
      };
      const checkTaskMeta = async (data) => {
        // if (!val) val = selectedTaskId.value;
        // taskMeta.value = await api.checkTaskMeta(val);
        // taskMeta.value.result = JSON.parse(taskMeta.value.result);
        console.log(data);
        if (typeof data === "string" || data instanceof String) {
          taskMeta.value = await api.getTaskMeta(data);
          taskMeta.value.result = JSON.parse(taskMeta.value.result);
        }
        else {
          taskMeta.value = {...data};
          // eval(decode_func.value);
          // taskMeta.value.result = decode_func(taskMeta.value.result);
          if(typeof taskMeta.value.result === "string" || taskMeta.value.result instanceof String){
            taskMeta.value.result = JSON.parse(taskMeta.value.result);
          }
        }
      };
      const stopTask = async (val = null) => {
        if (!val) val = selectedTaskId.value;
        api.stopTask(val);
      };

      // Tab logic
      const activeTab = ref('Dashboard');
      const TABS = ref(["Dashboard", "Fibonacci"]);

      // Actions
      const all_schema = ref({});
      const dynamicTasks = ref([]); // indexed by tab


      function initializeFormData(schema, data, key=null) {
        if (key && data[key] && data[key]===null){
          data[key] = {};
          data = data[key];
        }
        if (!schema || typeof schema !== 'object') return data;

        const props = schema.properties || {};
        for (const key in props) {
          const field = props[key] || {};
          let type = field.type;
          if (Array.isArray(type)) type = type.find(t => t !== 'null') || 'null';

          if (type === 'boolean') {
            data[key] = field.default === undefined ? false : field.default;

          } else if (type === 'integer' || type === 'number') {
            data[key] = field.default === undefined ? 0 : field.default;

          } else if (type === 'string') {
            data[key] = field.default === undefined ? '' : field.default;

          } else if (type === 'object') {
            if (field.default && typeof field.default === 'object' && !Array.isArray(field.default)) {
              data[key] = JSON.parse(JSON.stringify(field.default));
            } else {
              data[key] = {};
              initializeFormData(field, data[key]); // use field, not schema.properties[key]
            }

          } else if (type === 'array') {
            if (Array.isArray(field.default)) {
              data[key] = JSON.parse(JSON.stringify(field.default));
            } else {
              data[key] = [];
              const items = field.items;
              if (items && (items.type === 'object' || items.properties)) {
                data[key].addItem = () => {
                  const tmpitem = {};
                  initializeFormData(items, tmpitem);
                  data[key].push(tmpitem);
                };
                data[key].delItem = (index) => data[key].splice(index, 1);
              }
            }

          } else {
            data[key] = field.default === undefined ? null : field.default;
          }
        }
        return data;
      }

      api.getActions().then((action_list) => {
        // action_list = action_list.map((v) => v[v.type])
        all_schema.value = action_list;
        console.log(action_list);
        TABS.value = ["Dashboard", ...action_list.map((v) => v.name)];

        dynamicTasks.value = action_list.map(fn => {
          // Init an object for all top-level parameter groups
          const paramGroups = {};
          initializeFormData(fn.parameters, paramGroups);
          return paramGroups;
        });
      });

      async function submitDynamicTask(fn, i) {
        api.submitTask(fn.name.toLowerCase(), dynamicTasks.value[i],
          taskMeta, taskId, errorMessage, loading);
      }

      const autocompleteItems = ref([]);

      return {
        page, page_size,
        TABS, activeTab, api, all_schema,
        dynamicTasks, submitDynamicTask, autocompleteItems,
        tasks, taskOptions, selectedTaskId, taskMeta, workersInfo, fetchAndDisplayTasks, checkTaskMeta, stopTask, fetchWorkers,
        taskId, errorMessage, loading,
      };
    }
  });

  app.component('p-recursivejson', {
    props: ['data', 'level'],
    template: `
    <ul v-if="typeof data === 'object' && data !== null" :style="{ paddingLeft: (level || 0) * 14 + 'px', borderLeft: level ? '2px solid #e5e7eb' : '' }">
      <li v-for="(v, k) in data" :key="k">
        <span style="font-weight:bold;">{{k}}:</span>
        <p-recursivejson v-if="typeof v==='object' && v!==null" :data="v" :level="(level || 0)+1"/>
        <span v-else style="color:#444;">{{v}}</span>
      </li>
    </ul>
    <span v-else>{{ data }}</span>
  `
  });
  app.component('p-taskmeta', {
    props: ['data'],
    template: `
        <div>
        <div v-if="data">
            <div class="mb-2">
            <span class="font-bold">Status:</span>
            <span :class="{
                'text-green-600': data.status === 'SUCCESS',
                'text-red-600': data.status !== 'SUCCESS'
            }">
                {{ data.status }}
            </span>
            </div>
            <div class="mb-2">
            <span class="font-bold">Task ID:</span> {{ data.task_id }}
            </div>
            <div v-if="data.date_done" class="mb-2">
            <span class="font-bold">Date Done:</span> {{ data.date_done }}
            </div>
            <div v-if="data.result" class="mb-2">
            <span class="font-bold">Result:</span>
            <p-recursivejson class="bg-gray-100" :data="data.result.rets" :level="1" />
            </div>
            <div v-if="data.traceback" class="mb-2 text-red-600">

            </div>

        <div v-else>

  app.component('p-autoform', {
    props: ['schema', 'data', 'autits'], // autits = { value: [] } expected
    data() {
      return {
        anyOfActive: {} // e.g., set later as strings: '0', '1', ...
      };
    },
    mounted() {
      // initialize active tab per anyOf field to '0'
      for (const [k, f] of Object.entries(this.schema?.properties || {})) {
        if (Array.isArray(f.anyOf) && f.anyOf.length && this.anyOfActive[k] == null) {
          this.$set?.(this.anyOfActive, k, String(f.anyOf.length)) || (this.anyOfActive[k] = String(f.anyOf.length));
        }
      }
    },
    methods: {
      initializeFormData(schema, data) {
        if (data===null)data={};
        if (!schema || typeof schema !== 'object') return data;

        const props = schema.properties || {};
        for (const key in props) {
          const field = props[key] || {};
          let type = field.type;
          if (Array.isArray(type)) type = type.find(t => t !== 'null') || 'null';

          if (type === 'boolean') {
            data[key] = field.default === undefined ? false : field.default;

          } else if (type === 'integer' || type === 'number') {
            data[key] = field.default === undefined ? 0 : field.default;

          } else if (type === 'string') {
            data[key] = field.default === undefined ? '' : field.default;

          } else if (type === 'object') {
            if (field.default && typeof field.default === 'object' && !Array.isArray(field.default)) {
              data[key] = JSON.parse(JSON.stringify(field.default));
            } else {
              data[key] = {};
              this.initializeFormData(field, data[key]); // use field, not schema.properties[key]
            }

          } else if (type === 'array') {
            if (Array.isArray(field.default)) {
              data[key] = JSON.parse(JSON.stringify(field.default));
            } else {
              data[key] = [];
              const items = field.items;
              if (items && (items.type === 'object' || items.properties)) {
                data[key].addItem = () => {
                  const tmpitem = {};
                  this.initializeFormData(items, tmpitem);
                  data[key].push(tmpitem);
                };
                data[key].delItem = (index) => data[key].splice(index, 1);
              }
            }

          } else {
            data[key] = field.default === undefined ? null : field.default;
          }
        }
        return data;
      },
      getIcon(entry) {
        if (entry.isDir) return 'pi pi-fw pi-folder';
        const ext = String(entry.name || '').split('.').pop().toLowerCase();
        if (['jpg','png','gif','jpeg','bmp','svg','webp','avif'].includes(ext)) return 'pi pi-fw pi-image';
        if (['txt','md','log','csv','ini','yaml','yml'].includes(ext)) return 'pi pi-fw pi-file';
        if (['zip','rar','7z','tar','gz'].includes(ext)) return 'pi pi-fw pi-inbox';
        if (['js','ts','json','html','css','vue','jsx','tsx'].includes(ext)) return 'pi pi-fw pi-code';
        return 'pi pi-fw pi-file';
      },
      
      fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(reader.error);
          reader.onload = () => {
            const s = String(reader.result);                // "data:<mime>;base64,AAAA..."
            const comma = s.indexOf(',');
            resolve(comma >= 0 ? s.slice(comma + 1) : s);   // "AAAA..."
          };
          reader.readAsDataURL(file);
        });
      },

      // drop-in replacement
      async onFileUpload(key, event) {
        const files = event?.files ?? event?.target?.files ?? null;
        const file = files && files.length ? files[0] : null;

        const base64 = file ? await this.fileToBase64(file) : null;

        if (this?.$set) this.$set(this.data, key, base64);
        else this.data[key] = base64;

        console.log(`Loaded base64 for ${key}: ${file?.name ?? 'none'}`);
        this?.$emit?.('file-selected', { key, file, base64 });

        // optional: allow re-selecting same file
        if (event?.target && 'value' in event.target) event.target.value = '';
      },

      gw(field, key, value) {
        const w = field['x-pv-widget'];
        if (w) return w;

        if (field.type === 'boolean') return 'checkbox';

        if (field.type === 'string') {
          if (field.format === 'password') return 'password';
          if (field.format === 'date' || field.format === 'date-time') return 'calendar';
          if (field.format === 'email') return 'email';
          if (field.format === 'uri' || field.format === 'url') return 'url';
          if (field.format === 'color') return 'color';
          if (Array.isArray(field.enum)) return 'dropdown';
          if ((value && String(value).length > 200) || (field.maxLength && field.maxLength > 200)) return 'textarea';
          return 'text';
        }

        if (field.type === 'integer' || field.type === 'number') {
          if (Array.isArray(field.enum)) return 'dropdown';
          return 'number';
        }

        if (field.type === 'array') {
          if (field.items?.enum) return 'multiselect';
          return 'array';
          // return 'chips';
        }

        if (field.type === 'object') return 'autoform';

        return 'text';
      },
      ensureArray(key) {
        if (!Array.isArray(this.data[key])) this.$set?.(this.data, key, []) || (this.data[key] = []);
      },
      addObjectItem(key, schemaItem) {
        this.ensureArray(key);
        var blank = {};
        if (schemaItem?.properties) {
          for (const k of Object.keys(schemaItem.properties)) blank[k] = null;
        }
        else if (schemaItem?.type=='number') {
           blank = 0.0;
        }
        else if (schemaItem?.type=='integer') {
           blank = 0;
        }
        else if (schemaItem?.type=='string') {
           blank = '';
        }
        else if (schemaItem?.type=='boolean') {
           blank = false;
        }
        this.data[key].push(blank);
      },
      delObjectItem(key, i) {
        this.ensureArray(key);
        this.data[key].splice(i, 1);
      }
    },
    template: `
  <div class="w-full rounded overflow-hidden shadow-lg">
    <div v-for="(field, key) in schema.properties" :key="key" class="m-2">
      <!-- anyOf: Tabs -->
      <div v-if="field.anyOf">
        <label :for="key" class="block mb-1 font-medium">
          {{ field.title || key }}
          <span class="opacity-70">( {{ field.anyOf.map(i => i.title ? i.title : i.type).join(' | ') }} )</span>
          <span v-if="Array.isArray(schema.required) && schema.required.includes(key)" class="text-red-500">*</span>
        </label>

        <p-tabs v-model:value="anyOfActive[key]" @update:value="(e)=>{if(field.anyOf[parseInt(e)].type=='null'){data[key]=null}}">

          <p-tablist>
            <p-tab v-for="(item, i) in field.anyOf" :key="i" :value="String(i)">
              {{ item.title ? item.title : (item.type || 'option ' + (i+1)) }}
            </p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel v-for="(item, i) in field.anyOf" :key="i" :value="String(i)">
              
              <div v-if="item.type=='object'">
                <p-autoform :schema="item"
                            :data="initializeFormData(item,data,key)" :autits="autits"/>
              </div>
              
              <!-- Number / Integer -->
              <div v-else-if="gw(item, key, data[key]) === 'number'">
                <p-inputnumber v-model="data[key]" :inputId="key" class="w-full"
                  :useGrouping="false" :min="field.minimum" :max="field.maximum" :step="field.multipleOf" />
              </div>

              <!-- Checkbox (boolean) -->
              <div v-else-if="gw(field, key, data[key]) === 'checkbox'">
                <p-checkbox v-model="data[key]" :inputId="key" :binary="true" />
              </div>

              <div v-else-if="item.type!=='null'">
                <p-textarea v-model="data[key]" :id="key" class="w-full" />
              </div>

              <div v-else-if="item.type === 'null'">
                <p>The value is null now</p>
              </div>
              
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>
      </div>

      <!-- Simple types -->
      <div v-else-if="field.type">
        <label :for="key" class="block mb-1 font-medium">
          {{ field.title || key }} <span class="opacity-70">({{ field.type }})</span>
          <span v-if="Array.isArray(schema.required) && schema.required.includes(key)" class="text-red-500">*</span>
        </label>

        <!-- Switch -->
        <div v-if="gw(field, key, data[key]) === 'switch'">
          <p-toggleswitch v-model="data[key]" :inputId="key" />
        </div>

        <!-- Radio -->
        <div v-else-if="gw(field, key, data[key]) === 'radio'">
          <div class="flex gap-4">
            <div v-for="opt in field.enum" :key="opt" class="flex items-center gap-1">
              <p-radiobutton :inputId="key + '-' + opt" :name="key" :value="opt" v-model="data[key]" />
              <label :for="key + '-' + opt">{{ opt }}</label>
            </div>
          </div>
        </div>

        <!-- Slider -->
        <div v-else-if="gw(field, key, data[key]) === 'slider'">
          <p-slider v-model="data[key]" :min="field.minimum ?? 0" :max="field.maximum ?? 100" />
          <div class="text-sm mt-1">{{ data[key] }}</div>
        </div>

        <!-- Rating -->
        <div v-else-if="gw(field, key, data[key]) === 'rating'">
          <p-rating v-model="data[key]" :stars="field.maximum ?? 5" :cancel="false" />
        </div>

        <!-- File -->
        <div v-else-if="gw(field, key, data[key]) === 'file'">
          <p-fileupload chooseLabel="Choose" @select="onFileUpload(key, $event)"
                         @removeUploadedFile="()=>{data[key]=''}"  @remove="()=>{data[key]=''} "/>
          <div v-if="data[key]" class="text-xs mt-1 italic">{{ 'File selected : ' + data[key].slice(0,20) + '...' }}</div>
        </div>

        <!-- Color -->
        <div v-else-if="gw(field, key, data[key]) === 'color'">
          <p-colorpicker v-model="data[key]" :inputId="key" />
        </div>

        <!-- Object array -->
        <div v-else-if="gw(field, key, data[key]) === 'array'">
          <div class="flex gap-2 mb-2">
            <p-button icon="pi pi-plus" label="Add" severity="success" size="small"
              @click="addObjectItem(key, schema.properties[key].items)" />
          </div>
          <div v-for="(v, i) in (Array.isArray(data[key]) ? data[key] : (data[key] = []))" :key="i" class="mb-3 p-2 border rounded">
            <div class="flex justify-end mb-2">
              <p-button icon="pi pi-times" severity="danger" size="small" @click="delObjectItem(key, i)" />
            </div>

              <!-- Number / Integer -->
              <div v-if="gw(schema.properties[key].items, key, data[key]) === 'number'">
                <p-inputnumber v-model="data[key][i]" :inputId="key" class="w-full" :useGrouping="false"/>
              </div>

              <!-- Checkbox (boolean) -->
              <div v-else-if="gw(schema.properties[key].items, key, data[key]) === 'checkbox'">
                <p-checkbox v-model="data[key][i]" :inputId="key" :binary="true" />
              </div>

              <div v-else-if="schema.properties[key].items?.type === 'string'">
                <p-textarea v-model="data[key][i]" :id="key" class="w-full" />
              </div>

              <div v-else">
                <p-autoform :schema="schema.properties[key].items" :data="data[key][i]" :autits="autits" />
              </div>

          </div>
        </div>

        <!-- SelectButton -->
        <div v-else-if="gw(field, key, data[key]) === 'selectbutton'">
          <p-selectbutton v-model="data[key]" :options="field.enum" />
        </div>

        <!-- Dropdown (ENUM) -->
        <div v-else-if="gw(field, key, data[key]) === 'dropdown'">
          <p-dropdown v-model="data[key]" :options="field.enum" class="w-full"
            :placeholder="'Select ' + (field.title || key)" />
        </div>

        <!-- Text -->
        <div v-else-if="gw(field, key, data[key]) === 'text'">
          <p-inputtext v-model="data[key]" :id="key" class="w-full" />
        </div>

        <!-- Textarea -->
        <div v-else-if="gw(field, key, data[key]) === 'textarea'">
          <p-textarea v-model="data[key]" :id="key" class="w-full" :autoResize="true" />
        </div>

        <!-- Password -->
        <div v-else-if="gw(field, key, data[key]) === 'password'">
          <p-password v-model="data[key]" :inputId="key" class="w-full" toggleMask />
        </div>

        <!-- Calendar / DatePicker -->
        <div v-else-if="gw(field, key, data[key]) === 'calendar'">
          <p-datepicker v-model="data[key]" :inputId="key" class="w-full"
            :showIcon="true" :showTime="field.format === 'date-time'" />
          <!-- If using older PrimeVue, replace with p-calendar and props: showIcon, showTime -->
        </div>

        <!-- MultiSelect (ENUM arrays) -->
        <div v-else-if="gw(field, key, data[key]) === 'multiselect'">
          <p-multiselect v-model="data[key]" :options="field.items.enum" class="w-full"
            :placeholder="'Select ' + (field.title || key)" />
        </div>

        <!-- Number / Integer -->
        <div v-else-if="gw(field, key, data[key]) === 'number'">
          <p-inputnumber v-model="data[key]" :inputId="key" class="w-full"
            :useGrouping="false" :min="field.minimum" :max="field.maximum" :step="field.multipleOf" />
        </div>

        <!-- Checkbox (boolean) -->
        <div v-else-if="gw(field, key, data[key]) === 'checkbox'">
          <p-checkbox v-model="data[key]" :inputId="key" :binary="true" />
        </div>

        <!-- Nested object -->
        <div v-else-if="gw(field, key, data[key]) === 'autoform'">
          <p-autoform :schema="schema.properties[key]" :data="data[key] ||= {}" :autits="autits" />
        </div>

        <!-- Fallback -->
        <div v-else>
          <p-textarea v-model="data[key]" :id="key" class="w-full" />
        </div>
      </div>
    </div>
  </div>
    `
  });
    
  app.mount('#app');
</script>

</html>
